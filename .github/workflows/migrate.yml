# Aplica a Supabase los archivos SQL nuevos de supabase/migrations/.
# Necesita el secret SUPABASE_DB_URL (cadena de conexión "Session pooler").
# Si el secret no existe todavía, avisa y termina en verde en vez de fallar.
name: Migraciones Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/apply-migrations.sh'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que existe el secret
        id: check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning title=Secret ausente::No existe el secret SUPABASE_DB_URL. Créalo en Settings → Secrets and variables → Actions y vuelve a lanzar este workflow. Las migraciones NO se han aplicado."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            # Oculta también la contraseña por separado: si psql falla y la repite en
            # el mensaje de error, GitHub la sustituirá por *** en el registro.
            pw=$(printf '%s' "$SUPABASE_DB_URL" | sed -n 's|^[^:]*://[^:]*:\(.*\)@[^@]*$|\1|p')
            if [ -n "$pw" ]; then echo "::add-mask::$pw"; fi
            case "$pw" in
              *[!A-Za-z0-9]*)
                echo "::error title=Contraseña con símbolos::La contraseña dentro de SUPABASE_DB_URL contiene símbolos. Usa solo letras y números (cámbiala en Supabase → Project Settings → Database → Reset database password) y actualiza el secret."
                exit 1 ;;
            esac
          fi

      - name: Aplicar migraciones pendientes
        if: steps.check.outputs.present == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/apply-migrations.sh
