# Publica la web en GitHub Pages en cada push a main.
# 1) instala dependencias  2) ejecuta los tests  3) construye  4) sube dist/ a la rama gh-pages
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # GitHub Pages sirve 404.html cuando no encuentra una ruta; con router en modo hash
      # no hace falta, pero lo copiamos por si alguien abre una URL antigua sin #.
      - name: Copiar index.html como 404.html
        run: cp dist/index.html dist/404.html

      - name: Publicar en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
