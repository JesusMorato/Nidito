# Publica en Supabase las funciones de supabase/functions/ (los avisos del móvil).
# Necesita el secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
# Si el secret no existe todavía, avisa y termina en verde en vez de fallar.
name: Funciones Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/funciones.yml'
  workflow_dispatch:

concurrency:
  group: funciones
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que existe el secret
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning title=Secret ausente::No existe el secret SUPABASE_ACCESS_TOKEN. Créalo en Settings → Secrets and variables → Actions y vuelve a lanzar este workflow. La función NO se ha publicado."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.present == 'true'
        with:
          version: latest

      - name: Publicar notify-partner
        if: steps.check.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # El identificador del proyecto sale de la URL pública que ya está en .env
          ref=$(grep '^VITE_SUPABASE_URL=' .env | sed -E 's#.*https://([^.]+)\..*#\1#')
          echo "Proyecto: $ref"
          supabase functions deploy notify-partner --project-ref "$ref"
