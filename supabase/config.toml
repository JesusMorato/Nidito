# Identificador del proyecto de Supabase (es público: sale en la URL de la API).
# Lo usa la CLI para saber dónde publicar las funciones de supabase/functions/.
# El workflow funciones.yml lo saca de .env, así que aquí solo es informativo.
project_id = "yckmveftvofkpuqhjjnq"

[functions.notify-partner]
# Solo se puede llamar con una sesión válida: Supabase comprueba el token antes
# de que la función se ejecute.
verify_jwt = true

[functions.ingest-email]
# La llama el Apps Script de Gmail, sin sesión: el código secreto del cuerpo identifica
# a la persona (lo comprueba ingest_email en la base de datos).
verify_jwt = false
